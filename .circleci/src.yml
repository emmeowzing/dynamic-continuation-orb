version: 2.1


orbs:
  orb-tools: circleci/orb-tools@11.6.1
  circleci-cli: circleci/circleci-cli@0.1.9
  general: premiscale/general@1.2.8
  # bats: circleci/bats@1.1.0


executors:
  default:
    docker:
      - image: cimg/base:2024.09


jobs:
  cli-compatibility:
    parameters:
      cli-version:
        type: string
    executor: default
    steps:
      - checkout
      - run:
          name: Install selected CLI
          environment:
            SH_CIRCLECI_CLI_VERSION: << parameters.cli-version >>
          command: bash src/scripts/install-circleci.sh
      - run:
          name: Validate with selected CLI
          environment:
            SH_CONTINUE_CONFIG: src/tests/data/161/valid.yml
            SH_PROJECT_TYPE: github
            SH_CIRCLE_ORGANIZATION: $CIRCLE_PROJECT_USERNAME
            SH_CIRCLE_TOKEN: $CIRCLE_TOKEN
          command: bash -eo pipefail src/scripts/validate.sh


workflows:
  src:
    jobs:
      - orb-tools/lint:
          resource_class: small

      - orb-tools/review:
          exclude: ''
          max_command_length: 256
          resource_class: small

      # - bats/run:
      #     path: ./src/tests
      #     save_test_results: true
      #     # setup-steps:

      - bats-tests:
          tests-directory: ./src/tests/

      - cli-compatibility:
          context: orb-publishing
          matrix:
            parameters:
              cli-version: [v0.1.26837, v1.0.46955]

      - orb-tools/pack:
          tag: '0.1.26837'
          requires:
            - orb-tools/lint
            - orb-tools/review
            # - bats/run
            - bats-tests
            - cli-compatibility

      - orb-tools/publish:
          name: publish development orb
          tag: '0.1.26837'
          enable-pr-comment: true
          vcs-type: << pipeline.project.type >>
          orb-name: bjd2385/dynamic-continuation
          pub-type: dev
          resource_class: small
          requires:
            - orb-tools/pack
          context:
            - orb-publishing
            - github
          filters:
            branches:
              ignore: main
